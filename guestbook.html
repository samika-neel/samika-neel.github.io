<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Guest Book — Samika &amp; Neelotpal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" sizes="64x64" href="assets/tinted/favicon-64.png" />
<link rel="apple-touch-icon" href="assets/tinted/apple-touch-icon.png" />
<link rel="stylesheet" href="site.css" />
<style>
  .phone { overflow: hidden; }

  .leaf {
    position: absolute;
    z-index: 0;
    pointer-events: none;
    background-repeat: no-repeat;
    background-size: contain;
    opacity: 0.12;
  }
  .leaf--tl {
    top: 4px; left: -50px;
    width: 145px; aspect-ratio: 588 / 742;
    background-image: url("assets/tinted/branch9_ink.png");
  }
  .leaf--tr {
    top: -8px; right: -44px;
    width: 132px; aspect-ratio: 350 / 425;
    background-image: url("assets/tinted/branch2_ink.png");
  }
  .page-head, .page-body { position: relative; z-index: 2; }

  .lede {
    text-align: center;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.02rem;
    line-height: 1.6;
    color: var(--ink-soft);
    padding: 0 0.4rem;
    margin-bottom: 1.8rem;
  }

  .field { margin-bottom: 1.2rem; }
  .field label {
    display: block;
    font-size: 0.58rem;
    font-weight: 400;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }
  .field input,
  .field textarea {
    width: 100%;
    padding: 0.75rem 0.85rem;
    font-family: var(--serif);
    font-size: 1.02rem;
    line-height: 1.6;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color 0.25s ease, background 0.25s ease;
  }
  .field input:focus,
  .field textarea:focus {
    outline: none;
    border-color: var(--gold);
    background: rgba(255, 255, 255, 0.85);
  }
  .field textarea { min-height: 8.5rem; resize: vertical; }

  /* the honeypot is for bots only — never shown, never announced */
  .hp {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }

  .counter {
    margin-top: 0.4rem;
    text-align: right;
    font-size: 0.66rem;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
  }
  .counter.is-over { color: #b3402f; }

  .gb-submit {
    display: block;
    width: 100%;
    margin-top: 0.4rem;
    padding: 0.95rem 1rem;
    border: 0;
    border-radius: 999px;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    text-indent: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .gb-submit:hover:not(:disabled) { opacity: 0.9; }
  .gb-submit:active:not(:disabled) { transform: scale(0.98); }
  .gb-submit:disabled { opacity: 0.45; cursor: default; }

  .gb-note {
    margin-top: 0.9rem;
    text-align: center;
    font-size: 0.8rem;
    line-height: 1.6;
    color: #b3402f;
  }
  .gb-note[hidden] { display: none; }

  .gb-thanks {
    text-align: center;
    padding: 2rem 0.5rem;
  }
  .gb-thanks p {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.12rem;
    line-height: 1.6;
    color: var(--ink);
  }
  .gb-thanks[hidden] { display: none; }
</style>
</head>
<body>
  <div class="phone">
    <span class="leaf leaf--tl" aria-hidden="true"></span>
    <span class="leaf leaf--tr" aria-hidden="true"></span>

    <header class="page-head">
      <h1>Guest Book</h1>
      <span class="sprig" aria-hidden="true"></span>
    </header>

    <main class="page-body">
      <p class="lede">Leave a note for Samika &amp; Neel</p>

      <form class="gb-form" id="gb-form" novalidate>
        <div class="field">
          <label for="gb-name">Your name</label>
          <input type="text" id="gb-name" name="name" maxlength="80"
                 autocomplete="name" required />
        </div>

        <div class="field">
          <label for="gb-message">Your message to the couple</label>
          <textarea id="gb-message" name="message" required></textarea>
          <p class="counter" id="gb-counter">0 / 100 words</p>
        </div>

        <div class="hp" aria-hidden="true">
          <label for="gb-website">Leave this empty</label>
          <input type="text" id="gb-website" name="website" tabindex="-1" autocomplete="off" />
        </div>

        <button class="gb-submit" id="gb-submit" type="submit">Send your message</button>
        <p class="gb-note" id="gb-note" hidden role="status"></p>
      </form>

      <div class="gb-thanks" id="gb-thanks" hidden>
        <p>Thank you — your note is safely in the book.</p>
      </div>

      <div class="page-end">
        <img src="assets/images/sn_oval.webp" alt="S and N monogram" loading="lazy" />
      </div>
    </main>
  </div>

<script src="site.js"></script>
<script>
  // Guest book -> Google Apps Script -> Google Sheet.
  // See apps-script/Code.gs for the endpoint and its setup notes.
  (function () {
    // Apps Script web app, bound to the guest book Sheet. The deployment must
    // be "Execute as: Me" + "Who has access: Anyone" — anything narrower puts a
    // Google sign-in wall in front of guests.
    var ENDPOINT = "https://script.google.com/macros/s/AKfycbzekh0nLQaGe6bI9RO_gsW54DRjm0OhUCSHN3JuLdns0LbVECDroTJBLCOYCi33PVU-/exec";

    var MAX_WORDS = 100;

    var form = document.getElementById("gb-form"),
        nameEl = document.getElementById("gb-name"),
        msgEl = document.getElementById("gb-message"),
        hpEl = document.getElementById("gb-website"),
        counter = document.getElementById("gb-counter"),
        note = document.getElementById("gb-note"),
        submit = document.getElementById("gb-submit"),
        thanks = document.getElementById("gb-thanks");

    function words(s) {
      var t = s.trim();
      return t ? t.split(/\s+/).length : 0;
    }

    function say(text) {
      note.textContent = text;
      note.hidden = !text;
    }

    function tally() {
      var n = words(msgEl.value), over = n > MAX_WORDS;
      counter.textContent = n + " / " + MAX_WORDS + " words";
      counter.classList.toggle("is-over", over);
      submit.disabled = over;
      if (over) say("Please keep it to " + MAX_WORDS + " words.");
      else if (note.textContent.indexOf("words") > -1) say("");
    }

    msgEl.addEventListener("input", tally);
    tally();

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      say("");

      if (!nameEl.value.trim() || !msgEl.value.trim()) {
        say("Please add your name and a message.");
        return;
      }
      if (words(msgEl.value) > MAX_WORDS) { tally(); return; }
      if (!ENDPOINT) {
        say("The guest book is not open just yet — please try again shortly.");
        return;
      }

      submit.disabled = true;
      submit.textContent = "Sending…";

      // A plain string body is a "simple" request, so the browser sends it
      // without a preflight — which Apps Script would not answer.
      fetch(ENDPOINT, {
        method: "POST",
        body: JSON.stringify({
          name: nameEl.value.trim(),
          message: msgEl.value.trim(),
          website: hpEl.value
        })
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.ok) done();
          else fail((res && res.error) || "Something went wrong. Please try again.");
        })
        .catch(function () {
          // The write usually landed even when the reply could not be read, so
          // retry opaquely rather than asking the guest to submit twice.
          fetch(ENDPOINT, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({
              name: nameEl.value.trim(),
              message: msgEl.value.trim(),
              website: hpEl.value
            })
          }).then(done, function () {
            fail("We could not reach the guest book. Please try again in a moment.");
          });
        });
    });

    function done() {
      form.hidden = true;
      thanks.hidden = false;
    }

    function fail(text) {
      submit.disabled = false;
      submit.textContent = "Send your message";
      say(text);
    }
  })();
</script>
</body>
</html>
