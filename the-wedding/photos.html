<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Photos &amp; Videos — Samika &amp; Neelotpal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" sizes="64x64" href="assets/tinted/favicon-64.png" />
<link rel="apple-touch-icon" href="assets/tinted/apple-touch-icon.png" />
<link rel="stylesheet" href="site.css" />
<style>
  .phone { overflow: hidden; }

  .leaf {
    position: absolute;
    z-index: 0;
    pointer-events: none;
    background-repeat: no-repeat;
    background-size: contain;
    opacity: 0.12;
  }
  .leaf--tl {
    top: 4px; left: -50px;
    width: 145px; aspect-ratio: 588 / 742;
    background-image: url("assets/tinted/branch9_ink.png");
  }
  .leaf--tr {
    top: -8px; right: -44px;
    width: 132px; aspect-ratio: 350 / 425;
    background-image: url("assets/tinted/branch2_ink.png");
  }
  .page-head, .page-body { position: relative; z-index: 2; }

  .lede {
    text-align: center;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.05rem;
    line-height: 1.65;
    color: var(--ink-soft);
    padding: 0 0.4rem;
  }

  .album-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 2rem auto 0;
    padding: 0.95rem 1.6rem;
    max-width: 20rem;
    border-radius: 999px;
    background: var(--ink);
    color: var(--paper);
    text-decoration: none;
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-indent: 0.18em;
    text-transform: uppercase;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .album-btn:hover { opacity: 0.9; }
  .album-btn:active { transform: scale(0.98); }
</style>
</head>
<body>
  <div class="phone">
    <span class="leaf leaf--tl" aria-hidden="true"></span>
    <span class="leaf leaf--tr" aria-hidden="true"></span>

    <header class="page-head">
      <h1>Photos &amp; Videos</h1>
      <span class="sprig" aria-hidden="true"></span>
    </header>

    <main class="page-body">
      <p class="lede">
        Share your captures with us, and view photos and videos from the event here
      </p>

      <a class="album-btn" href="https://photos.app.goo.gl/NvPEANQCxWu4wXsa9" target="_blank" rel="noopener">
        Open Album in Google Photos
      </a>

      <div class="page-end">
        <img src="assets/images/sn_oval.webp" alt="S and N monogram" loading="lazy" />
      </div>
    </main>
  </div>

<script src="site.js"></script>
</body>
</html>
