<style>
  /* Self-hosted script font — Cultivated Mind's Citadel Script Std Regular.
     Used only on .display headings; too flourished for small caps / body copy. */
  @font-face {
    font-family: "Citadel Script";
    src: url("assets/fonts/citadel-script-std-regular.otf") format("opentype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --paper: #f7f3ea;
    --paper-deep: #f0eadb;
    --ivory: #f4f1e8;   /* the redesigned wedding flow sits on ivory, not the cream */
    --ink: #283828;
    --ink-soft: rgba(40, 56, 40, 0.66);
    --gold: #a5804c;
    --forest: #223226;
    --cream: #f0e9d8;
    --hairline: rgba(40, 56, 40, 0.18);
    --serif: "Cormorant Garamond", "Times New Roman", serif;
    --script: "Citadel Script", "Pinyon Script", "Cormorant Garamond", cursive;
    --sans: "Jost", "Helvetica Neue", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    scroll-snap-type: y proximity;
    /* reserved always, so locking scroll for the envelope intro doesn't shift the
       layout by a scrollbar's width when it unlocks */
    scrollbar-gutter: stable;
  }

  body {
    background: var(--ivory);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 300;
    line-height: 1.65;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Phone frame ----------
     The whole design lives in one fixed portrait column. Its width is the
     container that every cqw unit below resolves against, so art and text
     scale to THIS frame — never the monitor. Nothing spreads apart when the
     window widens; a desktop just shows the same thin phone, centered. */
  .phone {
    width: min(100%, 400px);   /* thin portrait column; raise 400px to scale up */
    margin: 0 auto;
    position: relative;
    background: var(--ivory);
    container-type: inline-size;
    container-name: phone;
    overflow: hidden;          /* keep bleeding botanicals inside the frame */
  }
  /* On screens wider than the frame, set it off like a device on a surface */
  @media (min-width: 460px) {
    body { background: #d9d1bd; }
    .phone { box-shadow: 0 26px 70px -26px rgba(40, 56, 40, 0.45); }
  }

  ::selection { background: var(--gold); color: var(--paper); }

  /* ---------- Botanical artwork ----------
     Pre-tinted PNGs (assets/tinted/) used as background images. Plain image
     fetches work from file:// and every host — unlike CSS mask-image, whose
     CORS-mode fetch fails on local files. */
  .art {
    display: block;
    background-repeat: no-repeat;
    background-size: contain;
    background-position: center;
    pointer-events: none;
  }
  .art--branch1  { background-image: url("assets/tinted/branch1_ink.png");  aspect-ratio: 883 / 788; }
  .art--branch2  { background-image: url("assets/tinted/branch2_ink.png");  aspect-ratio: 350 / 425; }
  .art--branch3  { background-image: url("assets/tinted/branch3_ink.png");  aspect-ratio: 546 / 762; }
  .art--branch4  { background-image: url("assets/tinted/branch4_ink.png");  aspect-ratio: 685 / 1207; }
  .art--branch6  { background-image: url("assets/tinted/branch6_ink.png");  aspect-ratio: 998 / 1077; }
  .art--branch8  { background-image: url("assets/tinted/branch8_ink.png");  aspect-ratio: 819 / 965; }
  .art--branch9  { background-image: url("assets/tinted/branch9_ink.png");  aspect-ratio: 588 / 742; }
  .art--branch10 { background-image: url("assets/tinted/branch10_ink.png"); aspect-ratio: 976 / 1383; }
  .art--branch11 { background-image: url("assets/tinted/branch11_ink.png"); aspect-ratio: 481 / 400; }
  .art--bird1    { background-image: url("assets/tinted/bird1_ink.png");    aspect-ratio: 259 / 276; }
  .art--bird2    { background-image: url("assets/tinted/bird2_ink.png");    aspect-ratio: 253 / 253; }
  .art--logo     { background-image: url("assets/tinted/logo_ink.png");     aspect-ratio: 265 / 188; }

  .hero-logo {
    width: clamp(56px, 13cqw, 74px);
    /* pulled well up so the crest + mantra sit high and clear the botanicals */
    margin: -5rem auto 1.4rem;
    background-image: url("assets/tinted/logo_gold.png"); /* gold crest, not raw ink */
  }
  .rsvp-mark {
    width: 58px;
    margin: 4.8rem auto 0;
    background-image: url("assets/tinted/logo_gold.png");
    opacity: 0.9;
  }

  .plx { will-change: transform; }

  /* ---------- Typography helpers ---------- */
  .ganesh {
    font-family: "Amita", var(--serif); /* calligraphic Devanagari */
    font-size: clamp(1.1rem, 3.4cqw, 1.35rem);
    color: var(--gold);
    margin-top: -0.6rem;
    margin-bottom: 1.3rem;
  }
  .eyebrow {
    font-family: var(--sans);
    font-size: clamp(0.65rem, 1.8cqw, 0.78rem);
    font-weight: 400;
    letter-spacing: 0.42em;
    text-indent: 0.42em; /* balance the tracking */
    text-transform: uppercase;
    color: var(--gold);
  }
  .display {
    font-family: var(--script);
    font-weight: 400;
    line-height: 1.1;
  }

  .divider-sprig {
    width: 64px;
    margin: 1.4rem auto;
    opacity: 0.8;
    background-image: url("assets/tinted/branch11_gold.png");
  }

  section { position: relative; }

  .center-col {
    position: relative;
    z-index: 3;
    max-width: 34rem;
    margin: 0 auto;
    padding: 0 1.5rem;
    text-align: center;
  }

  /* ---------- Reveal on scroll ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(26px);
    transition: opacity 1s cubic-bezier(0.2, 0.6, 0.2, 1), transform 1s cubic-bezier(0.2, 0.6, 0.2, 1);
  }
  .reveal.is-in { opacity: 1; transform: none; }
  .reveal[data-delay="1"] { transition-delay: 0.15s; }
  .reveal[data-delay="2"] { transition-delay: 0.3s; }
  .reveal[data-delay="3"] { transition-delay: 0.45s; }
  .reveal[data-delay="4"] { transition-delay: 0.6s; }

  /* ================= REDESIGNED WEDDING FLOW (all on ivory) =================
     1 monogram splash · 2 full invitation card · 3 small countdown · 4 cards */
  .monogram-hero {
    position: relative;
    height: 100svh;
    overflow: hidden;
    background: var(--ivory);
    scroll-snap-align: start;
  }
  .monogram-emblem {
    position: absolute;
    z-index: 1;                       /* behind the pocket front */
    left: 50%;
    top: var(--pocket-meet-y, 52.5%); /* the envelope mouth */
    width: clamp(150px, 50cqw, 238px);
    height: auto;
    /* rises out of the pocket as the flap opens; --logo-out runs 0 → -95
       (JS), so it ends ~95% of its height above the mouth */
    transform: translate(-50%, calc(var(--logo-out, -95) * 1%));
    will-change: transform;
  }

  .wedding-hero {
    background: var(--ivory);
    scroll-snap-align: start;
  }
  .wedding-hero-img {
    display: block;
    width: 100%;
    height: auto;
  }

  .countdown-section {
    padding: clamp(3.5rem, 12cqw, 5.5rem) 0;
    background: var(--ivory);
    text-align: center;
    scroll-snap-align: start;
  }
  .countdown-section .eyebrow { display: block; margin-bottom: 1.7rem; }

  .celebrations {
    padding: 0 0 5rem;
    background: var(--ivory);
    scroll-snap-align: start;
  }

  /* ======================================================================
     Shared botanical framing — big branches hug the corners, birds fly
     inward. Orientation follows assets/ASSET_NOTES.md:
       branch3  — corner piece, weight top-left, crease on its RIGHT end
       branch10 — corner piece, drawing fills the LEFT ~40% of its canvas
       branch2  — upright bouquet, grows up from a single stem
       bird1    — faces RIGHT (place on the left)
       bird2    — faces LEFT  (place on the right)
     ====================================================================== */
  .frame { position: absolute; z-index: 1; opacity: 0.85; }

  /* top-left: mirror branch3 so its straight crease sits flush on the left */
  .corner-tl { top: 0; left: 0; width: clamp(210px, 54cqw, 560px); }
  .corner-tl .art { transform: scaleX(-1); }

  /* top-right: crop branch10 to the drawn left region, then flip to hug right */
  .corner-tr { top: 0; right: -3%; width: clamp(155px, 40cqw, 330px); }
  .corner-tr .art {
    aspect-ratio: 430 / 1383;
    background-size: cover;
    background-position: left top;
    transform: scaleX(-1);
  }

  /* bottom-left: rotate the top-right branch10 crop 180° to hang from bottom-left */
  .corner-bl { bottom: 0; left: -3%; width: clamp(155px, 40cqw, 330px); }
  .corner-bl .art {
    aspect-ratio: 430 / 1383;
    background-size: cover;
    background-position: left top;
    transform: rotate(180deg);
  }

  /* bottom-right: rotate branch3 180° so its weight lands in the bottom-right */
  .corner-br { bottom: 0; right: 0; width: clamp(210px, 54cqw, 560px); }
  .corner-br .art { transform: rotate(180deg); }

  .rsvp-bird-l, .rsvp-bird-r {
    position: absolute;
    width: clamp(70px, 15cqw, 118px);
    opacity: 0.85;
    z-index: 2;
  }
  .rsvp-bird-l .art { transform: rotate(-6deg); }
  .rsvp-bird-r .art { transform: rotate(5deg); }

  /* ================= HERO — the Save-the-Date "top page" ================= */
  .hero {
    min-height: 222cqw;   /* ≈ 360:800 portrait ratio, locked to the frame width */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 7rem 0 6rem;
    overflow: hidden;
    scroll-snap-align: start;
  }

  /* ---- Grid-anchored placement helper ----
     Each botanical is a .place wrapper with data-* attrs:
       data-cell:   "H-A1" or "R-F10" (section prefix + col letter + row #)
       data-anchor: TL | TR | BL | BR | C   (default C)
       data-rot:    rotation in degrees, clockwise (default 0)
       data-w:      element width in px (matches "size × default reference")
     The JS at the bottom of the page computes left/top so that AFTER rotation,
     the specified corner of the rotated bounding box sits at the specified
     corner of the specified cell. Rotate-then-align semantics.               */
  .place {
    position: absolute;
    z-index: 1;
    transform-origin: center center;
    pointer-events: none;
  }
  body.dev-grid-mode .place {
    outline: 1px solid #00ff88;
    outline-offset: 0px;
  }
  /* Per-asset crops for artwork whose canvas is bigger than its drawing.
     Ensures the wrapper's center = the DRAWING's visible center. */
  .place .art--branch10 {
    aspect-ratio: 430 / 1383;         /* drawing occupies left ~44% of canvas */
    background-size: cover;
    background-position: left top;
  }

  .hero-names {
    margin-top: 0.6rem;
    font-size: clamp(4.2rem, 16cqw, 8rem);
    letter-spacing: 0;
    line-height: 0.95;
  }
  /* Keep the ampersand line in the italic serif — it contrasts the script
     and stays legible where the flourished "and" would blur together. */
  .hero-names .amp {
    display: block;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 0.28em;
    color: var(--gold);
    margin: 0.2em 0;
  }
  /* Invitation hosts — the parents' names, in quiet uppercase serif */
  .hero-hosts {
    margin-top: 0.4rem;
    font-family: var(--serif);
    font-size: clamp(0.78rem, 2.3cqw, 0.98rem);
    font-weight: 500;
    letter-spacing: 0.1em;
    line-height: 1.85;
    text-transform: uppercase;
    color: var(--ink);
  }
  .hero-request {
    margin-top: 1.1rem;
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(1rem, 3cqw, 1.22rem);
    line-height: 1.55;
    color: var(--ink-soft);
  }
  .hero-sub {
    margin-top: 0.4rem;
    font-size: clamp(0.8rem, 2.4cqw, 0.95rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .hero-sub strong { font-weight: 400; color: var(--ink); }

  .countdown {
    display: flex;
    justify-content: center;
    gap: clamp(1.1rem, 5cqw, 2.4rem);
    margin-top: 0.5rem;
  }
  .countdown .unit { text-align: center; }
  .countdown .num {
    font-family: var(--serif);
    font-size: clamp(1.7rem, 6cqw, 2.4rem);
    font-weight: 500;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .countdown .lbl {
    margin-top: 0.35rem;
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .countdown .sep {
    font-family: var(--serif);
    font-size: clamp(1.4rem, 5cqw, 2rem);
    color: var(--hairline);
    align-self: flex-start;
    padding-top: 0.2em;
  }

  .scroll-cue {
    position: absolute;
    bottom: 2.4rem; left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    width: 1px; height: 52px;
    background: linear-gradient(var(--gold), rgba(165, 128, 76, 0.15));
    animation: cue 1.8s ease-in-out infinite;
  }
  @keyframes cue {
    0%, 100% { transform: translate(-50%, 0); opacity: 0.55; }
    50%      { transform: translate(-50%, 14px); opacity: 1; }
  }

  /* ================= RSVP — revealed on scroll ================= */
  .rsvp {
    min-height: 222cqw;   /* ≈ 360:800 portrait ratio, locked to the frame width */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8rem 0 9rem;
    background: var(--paper-deep);
    overflow: hidden;
    scroll-snap-align: start;
  }
  .rsvp-watermark {
    /* centered without transform — the parallax script owns this transform */
    position: absolute;
    left: calc(50% - min(42cqw, 300px));
    top: 12%;
    width: min(84cqw, 600px);
    opacity: 0.06;
    z-index: 0;
  }
  .rsvp-bird-l { top: 16%; left: clamp(0.5rem, 6cqw, 6rem); }
  .rsvp-bird-r { top: 12%; right: clamp(0.5rem, 6cqw, 6rem); }

  .rsvp-sprig {
    width: clamp(120px, 26cqw, 170px);
    margin: 0 auto 1.6rem;
    opacity: 0.85;
    background-image: url("assets/tinted/branch11_ink.png");
  }
  .rsvp h2 { font-size: clamp(3rem, 11cqw, 4.4rem); }
  .rsvp p {
    margin-top: 1.3rem;
    color: var(--ink-soft);
    font-size: 0.95rem;
  }
  .rsvp .deadline {
    margin-top: 1.6rem;
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
  }

  /* ================= THE CELEBRATIONS — event cards ================= */
  .celebrations-title { font-size: clamp(2.4rem, 9cqw, 3.6rem); }
  /* The event PNGs are complete, self-contained cards, so the CSV-injected
     framing botanicals would only clutter behind them — hide them here. */
  .rsvp .place { display: none !important; }
  .event-cards {
    /* break out of .center-col's 1.5rem side padding so the cards run the full
       width of the phone frame; stacked flush — no gap, no rounding */
    margin: 3.2rem -1.5rem 0;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .event-card-img {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ================= CONTACT ================= */
  .contact-block {
    margin-top: 3.4rem;
    text-align: center;
  }
  .contact-title { font-size: clamp(2.4rem, 9cqw, 3.6rem); }
  .contact-list {
    margin-top: 1.7rem;
    font-size: clamp(0.86rem, 2.5cqw, 0.98rem);
    color: var(--ink-soft);
  }
  .contact-row {
    margin: 0.55rem 0;
    line-height: 1.5;
  }
  /* the tappable number — looks like quiet gold text, not a browser button */
  .contact-num {
    font: inherit;
    color: var(--gold);
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    letter-spacing: 0.02em;
    border-bottom: 1px solid rgba(165, 128, 76, 0.35);
    transition: border-color 0.25s ease;
  }
  .contact-num:hover { border-bottom-color: var(--gold); }
  .contact-logo {
    display: block;
    width: clamp(90px, 24cqw, 122px);
    height: auto;
    margin: 2.6rem auto 0;
  }

  /* Call / WhatsApp chooser — a bottom action sheet over a dimmed page */
  .dial-sheet {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 1rem;
    background: rgba(40, 56, 40, 0.5);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
  }
  .dial-sheet[hidden] { display: none; }
  @media (min-width: 460px) {
    /* keep the sheet within the phone column on wide screens */
    .dial-sheet { left: calc(50% - 200px); right: auto; width: 400px; }
  }
  .dial-card {
    width: min(100%, 340px);
    background: var(--paper);
    border-radius: 18px;
    padding: 1.6rem 1.4rem 1.2rem;
    text-align: center;
    box-shadow: 0 -12px 40px rgba(40, 56, 40, 0.3);
  }
  .dial-name {
    font-family: var(--serif);
    font-size: 1.15rem;
    color: var(--ink);
  }
  .dial-number {
    margin-top: 0.15rem;
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
  }
  .dial-actions {
    display: flex;
    gap: 0.7rem;
    margin-top: 1.2rem;
  }
  .dial-btn {
    flex: 1;
    padding: 0.9rem 0.5rem;
    border-radius: 999px;
    text-decoration: none;
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-indent: 0.22em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper);
  }
  .dial-btn--wa { background: #1fa855; }
  .dial-close {
    margin-top: 0.9rem;
    width: 100%;
    padding: 0.7rem;
    background: none;
    border: 0;
    font: inherit;
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-indent: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .btn {
    display: inline-block;
    padding: 0.95rem 2.6rem;
    background: var(--ink);
    color: var(--paper);
    text-decoration: none;
    border-radius: 999px;
    font-size: 0.68rem;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    text-transform: uppercase;
    transition: background 0.3s ease, transform 0.3s ease;
  }
  .btn:hover { background: var(--forest); transform: translateY(-2px); }
  .btn--ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  .btn--ghost:hover { background: var(--ink); color: var(--paper); }
  .btn--small {
    padding: 0.72rem 1.9rem;
    font-size: 0.6rem;
  }
  .rsvp-intro {
    margin-top: 2.6rem;
  }
  .rsvp-contacts {
    margin-top: 1.4rem;
    font-size: 0.78rem;
    line-height: 1.9;
    color: var(--ink-soft);
  }
  .btn-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.9rem 1rem;
    margin-top: 2.6rem;
  }

  /* ================= DEV GRID OVERLAY =================
     Enable by appending ?grid=1 to the URL. Draws a labeled 8-col × 16-row
     grid over each of .hero and .rsvp so we can reference cells by name
     (e.g. H-C4 for hero column C row 4, R-F11 for rsvp column F row 11).
     Purely a design tool — never shipped to guests unless the flag is on. */
  .dev-grid {
    position: absolute;
    inset: 0;
    z-index: 900;
    pointer-events: none;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(10, 1fr);
    font-family: var(--sans);
  }
  .dev-grid .cell {
    border-right: 1px dashed rgba(200, 60, 60, 0.32);
    border-bottom: 1px dashed rgba(200, 60, 60, 0.32);
    position: relative;
  }
  .dev-grid .cell:nth-child(6n) { border-right: none; }
  .dev-grid .cell:nth-last-child(-n+6) { border-bottom: none; }
  .dev-grid .cell::after {
    content: attr(data-label);
    position: absolute;
    top: 4px;
    left: 5px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: rgba(200, 60, 60, 0.9);
    background: rgba(247, 243, 234, 0.7);
    padding: 1px 5px;
    border-radius: 3px;
    line-height: 1.4;
  }
  .dev-grid-legend {
    position: fixed;
    bottom: 10px;
    right: 10px;
    z-index: 1000;
    background: rgba(40, 56, 40, 0.9);
    color: var(--paper);
    font-family: var(--sans);
    font-size: 11px;
    padding: 8px 12px;
    border-radius: 6px;
    letter-spacing: 0.05em;
  }

  /* ================= OPENING ENVELOPE =================
     The visible phone is a crop through the centre of a landscape envelope.
     Its flap is rendered as a shaded, articulated paper mesh on canvas; these
     DOM layers form the envelope body, fold and reveal beneath it. */
  html.intro-lock, html.intro-lock body { overflow: hidden; overscroll-behavior: none; }

  .envelope-scene {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: none;
    overflow: hidden;
    isolation: isolate;
    cursor: pointer;
    background: transparent;
  }
  html.intro-ready .envelope-scene { display: block; }
  html.intro-ready .envelope-scene.is-done { display: none; }
  @media (min-width: 460px) {
    .envelope-scene { left: calc(50% - 200px); right: auto; width: 400px; }
  }

  /* The lower pocket is the static front of the envelope. It sits in the page
     flow (inside the first section) and the monogram pops out from behind it;
     it no longer slides — it just scrolls away with the page. */
  .envelope-pocket {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;              /* in front of the monogram (z-index 1) */
    background: transparent;
    pointer-events: none;
  }

  /* The viewport crops the centre of this actual 4:3 landscape sheet. Every
     panel has the same dimensions and paper image, so the lower envelope reads
     as one patterned sheet folded over itself—not a flat rectangle. */
  .envelope-pocket-panel {
    position: absolute;
    top: 0;
    left: 50%;
    width: var(--envelope-w, 1080px);
    height: 100%;
    transform: translateX(-50%);
    /* envelope_2.png is opaque white paper with a gold floral print; a white
       base matches it if any sliver shows past the image. Sized to the panel
       HEIGHT (auto 100%), not its full width, so the phone shows ~half the
       sheet instead of a heavily magnified centre slice. */
    background-color: #ffffff;
    background-image: url("assets/events/psd_edited/envelope_2.webp");
    background-position: center center;
    background-size: auto 100%;
    background-repeat: no-repeat;
  }

  /* Two side folds are glued first; their inner edges meet below the mouth. */
  .envelope-pocket-panel--left {
    z-index: 1;
    clip-path: polygon(0 0, 50% var(--pocket-meet-y, 52.5%), 0 100%);
    background-image:
      linear-gradient(112deg, rgba(255,255,255,0.11), transparent 45%, rgba(67,49,25,0.075)),
      url("assets/events/psd_edited/envelope_2.webp");
    background-position: center, center center;
    background-size: 100% 100%, auto 100%;
    filter: drop-shadow(2px -1px 2px rgba(67,49,27,0.24));
  }
  .envelope-pocket-panel--right {
    z-index: 1;
    clip-path: polygon(100% 0, 50% var(--pocket-meet-y, 52.5%), 100% 100%);
    background-image:
      linear-gradient(248deg, rgba(255,255,255,0.1), transparent 45%, rgba(67,49,25,0.07)),
      url("assets/events/psd_edited/envelope_2.webp");
    background-position: center, center center;
    background-size: 100% 100%, auto 100%;
    filter: drop-shadow(-2px -1px 2px rgba(67,49,27,0.22));
  }

  /* The bottom fold is last, covering and gluing the side-fold tips. */
  .envelope-pocket-panel--bottom {
    z-index: 2;
    clip-path: polygon(0 100%, 100% 100%, 50% calc(var(--pocket-meet-y, 52.5%) - 2px));
    background-image:
      linear-gradient(0deg, rgba(255,255,255,0.09), transparent 58%, rgba(79,58,30,0.09)),
      url("assets/events/psd_edited/envelope_2.webp");
    background-position: center, center center;
    background-size: 100% 100%, auto 100%;
    filter: drop-shadow(0 -2px 2.5px rgba(65,47,25,0.26));
  }

  .envelope-pocket-seams {
    position: absolute;
    z-index: 3;
    top: 0;
    left: 50%;
    width: var(--envelope-w, 1080px);
    height: 100%;
    transform: translateX(-50%);
    overflow: visible;
    pointer-events: none;
  }
  .envelope-pocket-seams .crease-dark {
    fill: none;
    stroke: rgba(77, 57, 31, 0.34);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .envelope-pocket-seams .crease-light {
    fill: none;
    stroke: rgba(255, 253, 243, 0.62);
    stroke-width: 1.15;
    stroke-linecap: round;
    stroke-linejoin: round;
    transform: translateY(1.6px);
  }

  .envelope-canvas {
    position: absolute;
    inset: 0;
    z-index: 4;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* The fold is kept separate from the mesh so its compressed paper edge stays
     sharp even when the flap is almost edge-on. */
  .envelope-fold {
    position: absolute;
    z-index: 5;
    top: 0;
    left: -14%;
    width: 128%;
    height: 6px;
    opacity: var(--fold-o, 1);
    background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(103,80,49,0.31) 46%, rgba(255,255,255,0.22) 62%, transparent);
    box-shadow: 0 var(--fold-shadow-y, 7px) var(--fold-shadow-blur, 14px) rgba(53, 38, 21, var(--fold-shadow-o, 0.2));
  }

  /* Wax-style seal glued to the flap's tip. The render loop tracks the tip
     vertex every frame (--seal-x/--seal-y in px, --seal-s the perspective
     scale) so the seal rides up with the lifting flap, as if stuck to it. */
  .envelope-seal {
    position: absolute;
    z-index: 5;
    left: var(--seal-x, 50%);
    top: var(--seal-y, 52%);
    width: clamp(78px, 22.5vw, 105px);
    transform: translate(-50%, -50%) scale(var(--seal-s, 1));
    filter: drop-shadow(0 3px 5px rgba(53, 38, 21, 0.42));
    pointer-events: none;
    will-change: transform;
  }
  @media (min-width: 460px) {
    .envelope-seal { width: 99px; }
  }

  .envelope-hint {
    position: absolute;
    z-index: 6;
    left: 0; right: 0;
    bottom: max(2rem, 6svh);
    text-align: center;
    font-family: var(--sans);
    font-size: 0.6rem;
    letter-spacing: 0.38em;
    text-indent: 0.38em;
    text-transform: uppercase;
    color: rgba(40, 56, 40, 0.7);
    opacity: var(--hint-o, 1);
    text-shadow: 0 1px rgba(255,255,255,0.6);
    will-change: opacity;
  }
  .envelope-hint i {
    display: block;
    width: 1px;
    height: 32px;
    margin: 0.9rem auto 0;
    background: linear-gradient(rgba(40, 56, 40, 0.55), rgba(40, 56, 40, 0));
    animation: envelopecue 1.9s ease-in-out infinite;
  }
  @keyframes envelopecue {
    0%, 100% { transform: translateY(0); opacity: 0.5; }
    50%      { transform: translateY(-10px); opacity: 1; }
  }

  /* private preview gate */
  body.gate-locked > *:not(#gate-overlay) { display: none !important; }
  #gate-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;

  }
  .gate-error { color: #a83a3a; font-size: 0.82rem; min-height: 1.1em; }

  /* ---------- Loading screen ----------
     Shown after the gate opens while every image + font preloads, so the
     envelope and the scroll that follows are perfectly smooth. */
  #preloader {
    position: fixed;
    inset: 0;
    z-index: 9000;                 /* above the envelope (60), below the gate */
    display: none;
    flex-direction: column;
    align-items: center;

    gap: 1.9rem;

  html.is-loading #preloader { display: flex; }

  .preloader-mark {
    width: clamp(96px, 30vw, 140px);

  }
  @keyframes preloaderPulse {

  }
  .preloader-bar {
    width: min(58vw, 190px);
    height: 2px;
    background: var(--hairline);
    border-radius: 2px;
    overflow: hidden;
  }
  .preloader-bar span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--gold);
    transition: width 0.35s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    .preloader-mark { animation: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .reveal { opacity: 1; transform: none; transition: none; }
    .plx { transform: none !important; }
    .scroll-cue { animation: none; transform: translateX(-50%); }
    /* skip the decorative envelope motion entirely */
    .envelope-scene { display: none !important; }
  }
</style>

<script>
  // ---------- Countdown ----------
  (function () {
    var target = new Date("2026-11-26T16:00:00+05:30").getTime();
    var d = document.getElementById("cd-d"),
        h = document.getElementById("cd-h"),
        m = document.getElementById("cd-m"),
        s = document.getElementById("cd-s");
    function tick() {
      var diff = Math.max(0, target - Date.now());
      d.textContent = Math.floor(diff / 864e5);
      h.textContent = String(Math.floor(diff / 36e5) % 24).padStart(2, "0");
      m.textContent = String(Math.floor(diff / 6e4) % 60).padStart(2, "0");
      s.textContent = String(Math.floor(diff / 1e3) % 60).padStart(2, "0");
    }
    tick();
    setInterval(tick, 1000);
  })();

  var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- Reveal on scroll ----------
  (function () {
    var els = document.querySelectorAll(".reveal");
    if (reducedMotion || !("IntersectionObserver" in window)) {
      els.forEach(function (el) { el.classList.add("is-in"); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          e.target.classList.add("is-in");
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.18, rootMargin: "0px 0px -6% 0px" });
    els.forEach(function (el) { io.observe(el); });
  })();

  // ---------- Grid-anchored placement layout (CSV-driven) ----------
  // botanicals-wedding.csv is this invitation's own placement file (the public
  // save-the-date.html keeps using botanicals.csv), so the two pages' flowers
  // can be positioned independently. Columns: asset,cell,anchor,rotation,size_pct,mirror,notes
  //   asset      — matches .art--{asset}   (branch1..branch11, bird1, bird2, logo)
  //   cell       — "H-A1".."H-F10" or "R-A1".."R-F10"  (section-col-row)
  //   anchor     — TL | TR | BL | BR | C   (which corner of the piece
  //                lands on that corner of the cell, AFTER rotation)
  //   rotation   — degrees, clockwise
  //   size_pct   — % of the asset's default reference width (see botanicals.html)
  //   mirror     — TRUE to flip horizontally, FALSE otherwise
  //   notes      — free text, ignored by the loader
  // Edit the CSV, save, and refresh the page — no HTML/JS edits needed.
  (function () {
    var COLS = "ABCDEF";
    var CW = 100 / 6;    // cell width in cqw
    var CH = 222 / 10;   // cell height in cqw
    var phoneEl = document.querySelector(".phone");

    // Default reference width (px) per asset — matches botanicals.html.
    var DEFAULT_W = {
      branch1: 220, branch2: 140, branch3: 200, branch4: 160,
      branch6: 240, branch8: 230, branch9: 160, branch10: 200,
      branch11: 110, bird1: 90, bird2: 90, logo: 90
    };

    function parseCSV(text) {
      var lines = text.replace(/\r\n/g, "\n").split("\n").filter(function (l) { return l.trim() !== ""; });
      var header = lines[0].split(",").map(function (h) { return h.trim(); });
      return lines.slice(1).map(function (line) {
        var cells = line.split(",").map(function (c) { return c.trim(); });
        var row = {};
        header.forEach(function (h, i) { row[h] = cells[i] !== undefined ? cells[i] : ""; });
        return row;
      });
    }

    function buildPlaceElement(row) {
      var el = document.createElement("div");
      el.className = "place";
      el.dataset.cell = row.cell;
      el.dataset.anchor = (row.anchor || "C").toUpperCase();
      el.dataset.rot = row.rotation || "0";
      var pct = parseFloat(row.size_pct || "100") / 100;
      var defaultW = DEFAULT_W[row.asset] || 200;
      el.dataset.w = Math.round(defaultW * pct);
      el.dataset.mirror = /^true$/i.test(row.mirror || "") ? "1" : "0";

      var art = document.createElement("div");
      art.className = "art art--" + row.asset;
      el.appendChild(art);
      return el;
    }

    function loadFromCSV() {
      // cache: "no-store" + a timestamp param — the dev server sends no
      // Cache-Control header, so browsers can otherwise serve a stale copy
      // of the CSV on refresh even after you've saved new edits to disk.
      return fetch("botanicals-wedding.csv?t=" + Date.now(), { cache: "no-store" })
        .then(function (res) {
          if (!res.ok) throw new Error("botanicals-wedding.csv fetch failed: " + res.status);
          return res.text();
        })
        .then(function (text) {
          var rows = parseCSV(text);
          var heroEl = document.querySelector(".hero");
          var rsvpEl = document.querySelector(".rsvp");
          rows.forEach(function (row) {
            if (!row.asset || !row.cell) return;
            var section = row.cell.charAt(0).toUpperCase();
            var parent = section === "H" ? heroEl : section === "R" ? rsvpEl : null;
            if (!parent) return;
            var el = buildPlaceElement(row);
            parent.appendChild(el);
          });
        })
        .catch(function (err) {
          console.warn("Botanical placement CSV not loaded:", err);
        });
    }

    function layoutOne(el) {
      var m = (el.dataset.cell || "").match(/^([HR])-([A-F])(\d+)$/);
      if (!m) return;
      var colIdx = COLS.indexOf(m[2]);
      var row = parseInt(m[3], 10);
      var anchor = (el.dataset.anchor || "C").toUpperCase();
      var rot = parseFloat(el.dataset.rot || "0");
      var wPx = parseFloat(el.dataset.w || "200");
      var mirror = el.dataset.mirror === "1" ? -1 : 1;

      el.style.width = wPx + "px";
      el.style.transform = "scaleX(" + mirror + ") rotate(" + rot + "deg)";
      el.style.left = "0px";
      el.style.top = "0px";

      var w = el.offsetWidth;
      var h = el.offsetHeight;
      var phoneW = phoneEl.getBoundingClientRect().width;
      var cqw = phoneW / 100;

      var cxCqw, cyCqw;
      switch (anchor) {
        case "TL": cxCqw = colIdx * CW;         cyCqw = (row - 1) * CH;   break;
        case "TR": cxCqw = (colIdx + 1) * CW;   cyCqw = (row - 1) * CH;   break;
        case "BL": cxCqw = colIdx * CW;         cyCqw = row * CH;         break;
        case "BR": cxCqw = (colIdx + 1) * CW;   cyCqw = row * CH;         break;
        case "C":  cxCqw = (colIdx + 0.5) * CW; cyCqw = (row - 0.5) * CH; break;
        default: return;
      }
      var cxPx = cxCqw * cqw;
      var cyPx = cyCqw * cqw;

      var rRad = rot * Math.PI / 180;
      var bw = Math.abs(w * Math.cos(rRad)) + Math.abs(h * Math.sin(rRad));
      var bh = Math.abs(w * Math.sin(rRad)) + Math.abs(h * Math.cos(rRad));

      var px, py;
      switch (anchor) {
        case "TL": px = cxPx - w/2 + bw/2; py = cyPx - h/2 + bh/2; break;

        case "BL": px = cxPx - w/2 + bw/2; py = cyPx - h/2 - bh/2; break;
        case "BR": px = cxPx - w/2 - bw/2; py = cyPx - h/2 - bh/2; break;

    legend.textContent = "GRID · H = hero · R = rsvp · A–F cols · 1–10 rows";
    document.body.appendChild(legend);
  })();

  // ---------- Parallax on the botanicals ----------
  (function () {
    if (reducedMotion) return;
    var plxEls = Array.prototype.slice.call(document.querySelectorAll(".plx"));
    var vh = window.innerHeight;
    window.addEventListener("resize", function () { vh = window.innerHeight; });

    var ticking = false;
    function update() {
      ticking = false;
      plxEls.forEach(function (el) {
        var speed = parseFloat(el.dataset.plx || "0.1");
        var r = el.getBoundingClientRect();
        var offset = (r.top + r.height / 2) - vh / 2;
        el.style.transform = "translate3d(0," + (-offset * speed).toFixed(1) + "px,0)";
      });
    }
    function onScroll() {
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(update);
      }
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    update();
  })();

<script>
  // ---------- Loading screen ----------
  // After the gate opens, preload every image + the custom fonts, then hand off
  // to the envelope (fires "sn:ready"). A hard 8s ceiling means it never hangs.
  (function () {
    var root = document.documentElement,
        preloader = document.getElementById("preloader"),
        fill = document.getElementById("preloader-fill"),
        revealed = false;

    root.classList.add("is-loading"); // primed; shows the moment the gate clears

    var ASSETS = [
      "assets/events/psd_edited/envelope_2.webp",
      "assets/sn_oval.webp",
      "assets/sn_wax_seal.webp",
      "assets/events/wedding_cards/wedding_hero.webp",
      "assets/events/wedding_cards/mehendi_haldi.webp",
      "assets/events/wedding_cards/sangeet.webp",
      "assets/events/wedding_cards/wedding_vows.webp",
      "assets/events/wedding_cards/after_hours.webp",
      "assets/events/wedding_cards/rsvp.webp"
    ];

    function preloadImages() {
      var done = 0, total = ASSETS.length;
      return Promise.all(ASSETS.map(function (src) {
        return new Promise(function (resolve) {
          var img = new Image();
          img.onload = img.onerror = function () {
            done++;
            if (fill) fill.style.width = Math.round(done / total * 100) + "%";
            resolve();
          };
          img.src = src;
        });
      }));
    }

    function preloadFonts() {
      if (!document.fonts || !document.fonts.ready) return Promise.resolve();
      try {
        document.fonts.load('1em "Citadel Script"');
        document.fonts.load('italic 1em "Cormorant Garamond"');
        document.fonts.load('500 1em "Cormorant Garamond"');
        document.fonts.load('1em "Amita"');
      } catch (e) {}
      return document.fonts.ready;
    }

    function reveal() {
      if (revealed) return;
      revealed = true;
      if (preloader) preloader.classList.add("is-hidden");
      setTimeout(function () { root.classList.remove("is-loading"); }, 650);
      document.dispatchEvent(new Event("sn:ready"));
    }

    function run() {
      var guard = setTimeout(reveal, 8000); // never hang
      Promise.all([preloadImages(), preloadFonts()]).then(function () {
        clearTimeout(guard);
        reveal();
      });
    }

    if (document.body.classList.contains("gate-locked")) {
      document.addEventListener("sn:unlocked", run, { once: true });
    } else {
      run();
    }
  })();
</script>

<script>
  // ---------- Opening envelope ----------
  // The flap below is not a rotating triangle. It is a landscape paper mesh:
  // rows are bent around the fold, projected through a perspective camera and
  // texture-mapped as individual triangles. The same geometry casts a soft,
  // moving shadow onto the envelope body beneath it.
  (function () {
    var scene = document.getElementById("envelope-scene");
    if (!scene || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    var root = document.documentElement,
        canvas = document.getElementById("envelope-flap-canvas"),
        ctx = canvas.getContext("2d"),
        fold = scene.querySelector(".envelope-fold"),
        logo = document.querySelector(".monogram-emblem"),
        hint = scene.querySelector(".envelope-hint");

    var texture = new Image();
    texture.src = "assets/events/psd_edited/envelope_2.webp";

    var p = 0, target = 0, running = false, finished = false,
        vw = 390, vh = 844, dpr = 1, hingeY = 1, pocketMeetY = 443,
        flapW = 1080, flapH = 540, cameraD = 1420;

    function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
    function seg(v, a, b) { return clamp01((v - a) / (b - a)); }
    function easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
    function smooth(t) { return t * t * (3 - 2 * t); }
    function span() { return Math.max(390, window.innerHeight * 1.12); }

    function resize() {
      var r = scene.getBoundingClientRect();
      // Ignore zero-size measurements (a hidden/backgrounded tab reports 0×0);
      // keeping the last good size stops the envelope collapsing to a point.
      if (r.width < 2 || r.height < 2) return;
      vw = Math.max(1, r.width);
      vh = Math.max(1, r.height);
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(vw * dpr);
      canvas.height = Math.round(vh * dpr);
      flapH = Math.max(280, Math.min(560, vh * 0.527));
      // The phone is only the narrow central crop of a much wider envelope.
      flapW = Math.max(flapH * 2.08, vw * 4.15);
      hingeY = 1;
      pocketMeetY = vh * 0.525;
      cameraD = Math.max(1180, flapW * 1.32);
      // published on :root so the pocket (now in the page section) inherits them
      root.style.setProperty("--pocket-meet-y", pocketMeetY.toFixed(1) + "px");
      root.style.setProperty("--envelope-w", flapW.toFixed(1) + "px");
      render();
    }

    /* Rounded landscape-envelope outline. The broad shoulders sit beyond the
       portrait crop; only the centre slice is visible on a phone. */
    function halfWidth(t) {
      /* The full flap is far wider than the phone crop, so its long physical
         edges read as the two clean diagonal crease lines in the reference. */
      return flapW * 0.5 * Math.pow(Math.max(0, 1 - t), 1.015);
    }

    function project(x, y, z) {
      var f = cameraD / Math.max(180, cameraD - z);
      return { x: vw / 2 + x * f, y: hingeY + y * f, z: z };
    }

    function pathPoints(points) {
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (var i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.closePath();
    }

    function fillTriangle(points, color) {
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      ctx.lineTo(points[1].x, points[1].y);
      ctx.lineTo(points[2].x, points[2].y);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

    /* Affine texture mapping of one source triangle onto one projected paper
       triangle. Together, the triangles form a continuously bending sheet. */
    function textureTriangle(dst, src) {
      if (!texture.complete || !texture.naturalWidth) {
        fillTriangle(dst, "#e9dfca");
        return;
      }
      var x0 = src[0].x, y0 = src[0].y,
          x1 = src[1].x, y1 = src[1].y,
          x2 = src[2].x, y2 = src[2].y;
      var det = x0 * (y1 - y2) + x1 * (y2 - y0) + x2 * (y0 - y1);
      if (Math.abs(det) < 0.001) return;
      var a = (dst[0].x * (y1 - y2) + dst[1].x * (y2 - y0) + dst[2].x * (y0 - y1)) / det,
          c = (dst[0].x * (x2 - x1) + dst[1].x * (x0 - x2) + dst[2].x * (x1 - x0)) / det,
          e = (dst[0].x * (x1 * y2 - x2 * y1) + dst[1].x * (x2 * y0 - x0 * y2) + dst[2].x * (x0 * y1 - x1 * y0)) / det,
          b = (dst[0].y * (y1 - y2) + dst[1].y * (y2 - y0) + dst[2].y * (y0 - y1)) / det,
          d = (dst[0].y * (x2 - x1) + dst[1].y * (x0 - x2) + dst[2].y * (x1 - x0)) / det,
          f = (dst[0].y * (x1 * y2 - x2 * y1) + dst[1].y * (x2 * y0 - x0 * y2) + dst[2].y * (x0 * y1 - x1 * y0)) / det;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(dst[0].x, dst[0].y);
      ctx.lineTo(dst[1].x, dst[1].y);
      ctx.lineTo(dst[2].x, dst[2].y);
      ctx.closePath();
      ctx.clip();
      ctx.transform(a, b, c, d, e, f);
      ctx.drawImage(texture, 0, 0);
      ctx.restore();

    function render() {
      if (!ctx) return;
      var open = easeInOut(seg(p, 0.015, 0.5));
      // A barely lifted resting flap creates a narrow contact shadow before
      // the gesture begins, while preserving the closed-envelope silhouette.
      var restAngle = Math.PI / 120;
      var theta = restAngle + open * (Math.PI * 0.94 - restAngle);
      // once the flap is open (p≈0.5) it fades away so the popped-out monogram
      // and the page beneath can take over.
      var vanish = easeInOut(seg(p, 0.5, 0.9));

         remap more than a thousand texture triangles on every frame. */

      var geometry = [], y3 = 0, z3 = 0;

         full width, so the print shows at a natural size rather than a heavily
         magnified centre slice. texW is the on-screen width the whole sheet
         would span at that scale — the canvas counterpart of the pocket's
         `background-size: auto 100%`. */

      var texW = vh * natW / natH;

      var cropY = (natH - cropH) * 0.48;
      // Heavier cotton-paper curl: the sheet bows as it lifts and the free tip
      // curls back a little more, so the flap reads as a bending sheet, not a
      // rigid triangle rotating on a hinge.
      var bend = Math.sin(Math.PI * open) * 0.055;
      var tipFlex = Math.sin(Math.PI * open) * 0.085;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";

             curvature gather near the fold and tip, like heavy cotton paper. */
          var localAngle = theta
            - bend * Math.sin(Math.PI * tm)

          z3 += dy * Math.sin(localAngle);

            /* Source X follows the point's fixed position on the original
               sheet. Narrow rows therefore crop the pattern at the tip rather
               than squeezing the whole print into that smaller width. */
            s: {
              x: (0.5 + x / texW) * natW,
              y: cropY + t * cropH

      var outline = [];
      for (r = 0; r <= rows; r++) outline.push(geometry[r][0].d);

      /* The cast shadow uses the same lifted mesh outline projected onto the

      var shadow = [];
      for (var o = 0; o < outline.length; o++) {
        var op = outline[o];
        shadow.push({ x: op.x + op.z * 0.10, y: op.y + op.z * 0.24 });
      }
      var lift = Math.max(0, Math.sin(theta));
      ctx.save();
      ctx.filter = "blur(" + (4 + 29 * lift).toFixed(1) + "px)";
      var raisedShadowFade = 1 - smooth(seg(open, 0.12, 0.52));
      ctx.globalAlpha = (0.12 + 0.22 * lift) * raisedShadowFade * (1 - vanish);
      pathPoints(shadow);
      ctx.fillStyle = "#302313";
      ctx.fill();
      ctx.restore();

      /* Opaque paper base painted before the print. envelope_2.png is already
         opaque, but the base still guarantees a solid white sheet at the flap
         edges and while the texture is loading, so the envelope stays sealed. */
      ctx.globalAlpha = 1 - vanish;
      pathPoints(outline);
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      var triangles = [];
      for (r = 0; r < rows; r++) {
        for (c = 0; c < cols; c++) {
          var a = geometry[r][c], b = geometry[r][c + 1],
              cc = geometry[r + 1][c], d = geometry[r + 1][c + 1];
          var tCell = (r + 0.5) / rows;
          triangles.push({ d: [a.d, cc.d, b.d], s: [a.s, cc.s, b.s], z: (a.d.z + cc.d.z + b.d.z) / 3, angle: a.angle, t: tCell });
          triangles.push({ d: [b.d, cc.d, d.d], s: [b.s, cc.s, d.s], z: (b.d.z + cc.d.z + d.d.z) / 3, angle: d.angle, t: tCell });
        }
      }
      triangles.sort(function (m, n) { return m.z - n.z; });
      ctx.globalAlpha = 1 - vanish;
      for (var i = 0; i < triangles.length; i++) {
        var tri = triangles[i];
        textureTriangle(tri.d, tri.s);
        // Shade the sheet like curved paper under a soft light from above:
        //  · edge — facets turning edge-on to the camera darken
        //  · occ  — an ambient-occlusion trough along the fold, deepening as it lifts
        var edge = 1 - Math.abs(Math.cos(tri.angle - 0.18));
        var occ = smooth(1 - seg(tri.t, 0.0, 0.42)) * lift;
        var shade = 0.028 + 0.145 * edge + 0.12 * occ;
        fillTriangle(tri.d, "rgba(48,35,20," + shade.toFixed(3) + ")");
        // sheen — a soft highlight band riding the raised belly of the curl
        var sheen = smooth(seg(tri.t, 0.24, 0.55)) * (1 - smooth(seg(tri.t, 0.62, 0.98))) * lift * 0.13;
        if (sheen > 0.004) fillTriangle(tri.d, "rgba(255,253,246," + sheen.toFixed(3) + ")");
      }

      /* Only a restrained warm face tint remains; both sides retain the same
         generated paper texture and physical print scale. */
      var backShown = smooth(seg(theta, Math.PI * 0.46, Math.PI * 0.62));
      ctx.globalAlpha = (0.08 * (1 - backShown) + 0.025 * backShown) * (1 - vanish);
      pathPoints(outline);
      ctx.fillStyle = "#efe7d6";
      ctx.fill();

      ctx.globalAlpha = (0.34 + 0.2 * lift) * (1 - vanish);
      pathPoints(outline);
      ctx.lineWidth = 1.15;
      ctx.strokeStyle = "#756044";
      ctx.stroke();
      ctx.globalAlpha = 1;

      // the monogram rises out of the static pocket in step with the flap
      // opening, ending ~95% above the mouth (most of it clear of the pocket)
      root.style.setProperty("--logo-out", (-95 * open).toFixed(2));
      fold.style.setProperty("--fold-o", (1 - easeInOut(seg(p, 0.43, 0.62))).toFixed(3));
      fold.style.setProperty("--fold-shadow-y", (7 + 28 * lift).toFixed(1) + "px");
      fold.style.setProperty("--fold-shadow-blur", (14 + 34 * lift).toFixed(1) + "px");
      fold.style.setProperty("--fold-shadow-o", (0.2 + 0.42 * lift).toFixed(3));
      scene.style.opacity = (1 - vanish).toFixed(3);
      hint.style.setProperty("--hint-o", (1 - seg(p, 0, 0.06)).toFixed(3));
      // Glue the seal to the flap's tip vertex (last mesh row, centre column) so
      // it rides up with the flap; scale it by the tip's perspective factor so
      // it grows a touch as the tip leans toward the camera. It fades only with
      // the whole scene at the very end (scene opacity above).
      var sealTip = geometry[rows][cols >> 1].d;
      var fTip = cameraD / Math.max(180, cameraD - sealTip.z);
      scene.style.setProperty("--seal-x", sealTip.x.toFixed(1) + "px");
      scene.style.setProperty("--seal-y", sealTip.y.toFixed(1) + "px");
      scene.style.setProperty("--seal-s", fTip.toFixed(3));
    }

    function frame() {
      p += (target - p) * 0.16;
      if (Math.abs(target - p) < 0.0015) p = target;
      render();
      if (p !== target) requestAnimationFrame(frame);
      else if (p >= 1) finish();
      else running = false;
    }
    function tick() {
      if (!running) { running = true; requestAnimationFrame(frame); }
    }
    function nudge(px) {
      target = clamp01(target + px / span());
      tick();
    }

    function resumeIntro() {
      finished = false;
      scene.classList.remove("is-done");
      root.classList.add("intro-lock");
      window.scrollTo(0, 0);
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    }

    function onWheel(e) {
      if (finished) {
        if (e.deltaY >= 0 || window.scrollY > Math.abs(e.deltaY) + 1) return;
        resumeIntro();
      }
      e.preventDefault();
      nudge(e.deltaY);
    }
    var ty = null;
    function onTouchStart(e) { ty = e.touches[0].clientY; }
    function onTouchMove(e) {
      var y = e.touches[0].clientY;
      // touch multiplier: higher = the flap opens with a shorter swipe. At 3.0
      // a swipe of ~a third of the screen height opens it fully.
      var delta = ty === null ? 0 : (ty - y) * 3.0;
      ty = y;
      if (finished) {
        if (delta >= 0 || window.scrollY > Math.abs(delta) + 1) return;
        resumeIntro();
      }
      e.preventDefault();
      nudge(delta);
    }
    // Keyboard input keeps focus users from being trapped by the scroll lock.
    function onKey(e) {
      if (finished || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === " " || e.key === "PageDown" || e.key === "ArrowDown") {
        e.preventDefault();
        target = 1;
        tick();
      } else if (e.key === "PageUp" || e.key === "ArrowUp") {
        e.preventDefault();
        target = 0;
        tick();
      }
    }
    function onClick() { target = 1; tick(); }

    function listen() {
      window.addEventListener("wheel", onWheel, { passive: false });
      window.addEventListener("touchstart", onTouchStart, { passive: true });
      window.addEventListener("touchmove", onTouchMove, { passive: false });
      window.addEventListener("keydown", onKey);
      window.addEventListener("resize", resize);
      scene.addEventListener("click", onClick);
    }

    function finish() {
      if (finished) return;
      finished = true;
      running = false;
      scene.classList.add("is-done");
      root.classList.remove("intro-lock");
      if ("scrollRestoration" in history) history.scrollRestoration = "auto";
    }

    function start() {
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      window.scrollTo(0, 0);
      root.classList.add("intro-ready", "intro-lock");
      resize();
      listen();
    }

    // The loading screen fires "sn:ready" once the gate is open AND every image
    // and font has loaded, so the flap and the scroll never stutter.
    document.addEventListener("sn:ready", start, { once: true });

    texture.addEventListener("load", render);
  })();
</script>
</body>
</html>
