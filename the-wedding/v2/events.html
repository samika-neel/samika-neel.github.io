<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Events — Samika &amp; Neelotpal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" sizes="64x64" href="../assets/tinted/favicon-64.png" />
<link rel="apple-touch-icon" href="../assets/tinted/apple-touch-icon.png" />
<style>
  :root {
    --paper: #f7f3ea;
    --paper-deep: #f0eadb;
    --ink: #283828;
    --gold: #a5804c;
    --sans: "Jost", "Helvetica Neue", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--paper-deep);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  .phone {
    width: min(100%, 400px);
    margin: 0 auto;
    background: var(--paper);
    container-type: inline-size;
    position: relative;
  }
  @media (min-width: 460px) {
    body { background: #d9d1bd; }
    .phone { box-shadow: 0 26px 70px -26px rgba(40, 56, 40, 0.45); }
  }

  ::selection { background: var(--gold); color: var(--paper); }

  .back-fab {
    position: fixed;
    top: 1rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.55rem 1.1rem;
    font-family: var(--sans);
    font-size: 0.78rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gold);
    text-decoration: none;
    background: rgba(247, 243, 234, 0.88);
    border: 1px solid rgba(165, 128, 76, 0.25);
    border-radius: 20px;
    box-shadow: 0 2px 12px rgba(40, 56, 40, 0.1);
    -webkit-backdrop-filter: blur(12px) saturate(1.4);
    backdrop-filter: blur(12px) saturate(1.4);
    transition: opacity 0.3s;
  }
  .back-fab:active { opacity: 0.7; }

  .cards {
    display: flex;
    flex-direction: column;
    padding-top: 0.5rem;
  }

  .card-wrap {
    overflow: hidden;
    cursor: zoom-in;
    position: relative;
  }
  .card-wrap.zoomed { cursor: zoom-out; }

  .card-wrap img {
    display: block;
    width: 100%;
    height: auto;
    transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    transform-origin: center center;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .card-wrap.zoomed img {
    transform: scale(2.2);
    cursor: grab;
  }
  .card-wrap.zoomed.dragging img { cursor: grabbing; }
</style>
</head>
<body>
  <div class="phone">
    <a class="back-fab" href="index.html">&larr; Home</a>
    <div class="cards">
      <div class="card-wrap"><img src="../assets/events/main_wedding_emb.webp" alt="Wedding invitation — Samika and Neelotpal" loading="eager" /></div>
      <div class="card-wrap"><img src="../assets/events/satsang_emb.webp" alt="Satsang" loading="lazy" /></div>
      <div class="card-wrap"><img src="../assets/events/mehendi_haldi_emb.webp" alt="Mehendi & Haldi" loading="lazy" /></div>
      <div class="card-wrap"><img src="../assets/events/sangeet_emb.webp" alt="Sangeet" loading="lazy" /></div>
      <div class="card-wrap"><img src="../assets/events/wedding_vows_emb.webp" alt="Wedding Vows" loading="lazy" /></div>
      <div class="card-wrap"><img src="../assets/events/after_hours_emb.webp" alt="After Hours" loading="lazy" /></div>
    </div>
  </div>

<script>
(function () {
  document.querySelectorAll(".card-wrap").forEach(function (wrap) {
    var img = wrap.querySelector("img");
    var ox = 0, oy = 0, sx, sy, dragging = false;

    wrap.addEventListener("click", function (e) {
      if (dragging) return;
      if (wrap.classList.contains("zoomed")) {
        wrap.classList.remove("zoomed");
        img.style.transformOrigin = "center center";
        img.style.transform = "";
        ox = 0; oy = 0;
      } else {
        var rect = wrap.getBoundingClientRect();
        var px = ((e.clientX - rect.left) / rect.width) * 100;
        var py = ((e.clientY - rect.top) / rect.height) * 100;
        img.style.transformOrigin = px + "% " + py + "%";
        wrap.classList.add("zoomed");
        ox = 0; oy = 0;
      }
    });

    wrap.addEventListener("pointerdown", function (e) {
      if (!wrap.classList.contains("zoomed")) return;
      dragging = false;
      sx = e.clientX - ox;
      sy = e.clientY - oy;
      wrap.classList.add("dragging");
      wrap.setPointerCapture(e.pointerId);
    });

    wrap.addEventListener("pointermove", function (e) {
      if (!wrap.classList.contains("dragging")) return;
      dragging = true;
      ox = e.clientX - sx;
      oy = e.clientY - sy;
      var rect = wrap.getBoundingClientRect();
      var maxPan = rect.width * 0.6;
      ox = Math.max(-maxPan, Math.min(maxPan, ox));
      oy = Math.max(-maxPan, Math.min(maxPan, oy));
      img.style.transform = "scale(2.2) translate(" + (ox / 2.2) + "px, " + (oy / 2.2) + "px)";
    });

    wrap.addEventListener("pointerup", function () {
      wrap.classList.remove("dragging");
      if (dragging) {
        setTimeout(function () { dragging = false; }, 0);
      }
    });
  });
})();
</script>
</body>
</html>
