<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Events — Samika &amp; Neelotpal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" sizes="64x64" href="assets/tinted/favicon-64.png" />
<link rel="apple-touch-icon" href="assets/tinted/apple-touch-icon.png" />
<style>
  :root {
    --paper: #f7f3ea;
    --paper-deep: #f0eadb;
    --ink: #283828;
    --gold: #a5804c;
    --serif: "Cormorant Garamond", "Times New Roman", serif;
    --sans: "Jost", "Helvetica Neue", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--paper-deep);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  .phone {
    width: min(100%, 400px);
    margin: 0 auto;
    background: var(--paper);
    container-type: inline-size;
  }
  @media (min-width: 460px) {
    body { background: #d9d1bd; }
    .phone { box-shadow: 0 26px 70px -26px rgba(40, 56, 40, 0.45); }
  }

  ::selection { background: var(--gold); color: var(--paper); }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 1rem 1.2rem;
    font-family: var(--sans);
    font-size: 0.82rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gold);
    text-decoration: none;
  }
  .back-link:hover { text-decoration: underline; }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .cards img {
    display: block;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>
  <div class="phone">
    <a class="back-link" href="index.html">&larr; Home</a>
    <div class="cards">
      <img src="assets/events/main_wedding_emb.webp" alt="Wedding invitation — Samika and Neelotpal" loading="eager" />
      <img src="assets/events/satsang_emb.webp" alt="Satsang" loading="lazy" />
      <img src="assets/events/mehendi_haldi_emb.webp" alt="Mehendi & Haldi" loading="lazy" />
      <img src="assets/events/sangeet_emb.webp" alt="Sangeet" loading="lazy" />
      <img src="assets/events/wedding_vows_emb.webp" alt="Wedding Vows" loading="lazy" />
      <img src="assets/events/after_hours_emb.webp" alt="After Hours" loading="lazy" />
    </div>
  </div>
</body>
</html>
