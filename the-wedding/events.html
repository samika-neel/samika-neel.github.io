<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Events — Samika &amp; Neelotpal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" sizes="64x64" href="assets/tinted/favicon-64.png" />
<link rel="apple-touch-icon" href="assets/tinted/apple-touch-icon.png" />
<link rel="stylesheet" href="site.css" />
<style>
  .cards {
    display: flex;
    flex-direction: column;
    /* a thin white rule separates each invitation from the next */
    gap: 3px;
    background: #ffffff;
    padding: 3px 0 0;
  }

  .card-wrap { display: block; }

  .card-wrap img {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-select: none;
    user-select: none;
  }

  .events-end { padding-bottom: 5.5rem; }
</style>
</head>
<body>
  <div class="phone">
    <div class="cards">
      <div class="card-wrap"><img src="assets/events/main_wedding_emb.webp" alt="Wedding invitation — Samika and Neelotpal" loading="eager" /></div>
      <div class="card-wrap"><img src="assets/events/mehendi.webp" alt="Mehendi &amp; Haldi — 25 November 2026, Bonsai Garden" loading="lazy" /></div>
      <div class="card-wrap"><img src="assets/events/sangeet.webp" alt="Sangeet — 25 November 2026, Kosi Lawns" loading="lazy" /></div>
      <div class="card-wrap"><img src="assets/events/wedding.webp" alt="The Wedding — 26 November 2026, Kosi Lawns" loading="lazy" /></div>
      <div class="card-wrap"><img src="assets/events/after_hours.webp" alt="After Hours — 26 November 2026, Kosi Hall" loading="lazy" /></div>
      <div class="card-wrap"><img src="assets/events/rsvp.webp" alt="RSVP" loading="lazy" /></div>
    </div>
    <div class="page-end events-end">
      <img src="assets/images/sn_oval.webp" alt="S and N monogram" loading="lazy" />
    </div>
  </div>

<script src="site.js"></script>
</body>
</html>
